[tool.poetry]
name = "poke-watcher"
version = "0.1.0"
description = "Watches eBay for Pokemon card deals against TCGplayer market prices"
authors = ["Benler123"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "0.115.6"
uvicorn = { extras = ["standard"], version = "0.32.1" }
httpx = "0.28.1"
pydantic = "2.10.4"
pydantic-settings = "2.7.0"
beautifulsoup4 = "4.12.3"
python-dotenv = "1.0.1"
sqlalchemy = "2.0.36"
psycopg = { extras = ["binary"], version = "3.2.3" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
