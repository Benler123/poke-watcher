[project]
name = "poke-watcher"
version = "0.1.0"
description = "Watches eBay for Pokemon card deals against TCGplayer market prices"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "httpx==0.28.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "beautifulsoup4==4.12.3",
    "python-dotenv==1.0.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
